<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Josy's Vinyl</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/script.js"></script>

<body>
    <header>
        <div class="welcome">
            <img src="assets/img/vinyl.jpg" alt="vinyl" class="welcome-background">
            <h1>Josy's Vinyl</h1>
            <h2>Welcome to my Vinyl Collection!</h2>
        </div>

        <div id="nav-links">
            <nav class="info">
                <ul id="artists">
                    <!-- Content generated with JavaScript -->
                </ul>
                <ul id="year">
                    <!-- Content generated with JavaScript -->
                </ul>
                <ul id="genre">
                    <!-- Content generated with JavaScript -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="collection">
        <!-- Vinyl collection content generated with JavaScript -->
    </main>
    <section id="sign-up">
        <h2> Sign Up to Get the Latest vinyl News! </h2>
        <hr>
        <form id="signup-form" novalidate>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required>

            <p id="error-message">Please enter a valid name and email address.</p>
            <button type="submit">Sign Up</button>
        </form>
    </section>
    <footer>
        <p class="copyright">Josy &copy; 2025</p>
    </footer>
    </head>
</body>

</html>
